name: Game CI and releases

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packet-tactics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and export Web build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show tool versions
        run: |
          godot --version
          node --version
          npm --version

      - name: Run setup and artwork smoke tests plus AI simulation suite
        run: npm test

      - name: Export playable Web build
        run: npm run export:web

      - name: Package Web export for downloads
        run: |
          test -s dist/index.html
          cd dist
          zip -qr ../PacketTactics-Web.zip .

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacketTactics-Web
          path: |
            dist/
            PacketTactics-Web.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish tagged game release
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested Web build
        uses: actions/download-artifact@v4
        with:
          name: PacketTactics-Web
          path: release-assets

      - name: Create GitHub Release with Web build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \\
            release-assets/PacketTactics-Web.zip \\
            --repo "${GITHUB_REPOSITORY}" \\
            --title "Packet Tactics ${GITHUB_REF_NAME}" \\
            --generate-notes
